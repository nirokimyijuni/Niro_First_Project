# main에 push하면: 테스트(cargo test) 통과 → wasm 빌드(deploy/build.sh) → GitHub Pages 배포
# 관리: 케빈(에이전트). 결정 사항 D17.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 새 push가 오면 진행 중인 배포는 끝까지 두고 다음 것을 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v7

      - name: Rust stable + wasm32 타깃 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cargo 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: game

      - name: 열린 S1·S2 버그 확인 (있으면 배포하지 않음)
        run: |
          open_bugs=$(grep -lE '^- 심각도: *S[12]' qa/bugs/*.md | xargs -r -d '\n' grep -LE '^- 상태: *(닫힘|보류)' || true)
          if [ -n "$open_bugs" ]; then echo "$open_bugs"; exit 1; fi

      - name: 테스트 (실패하면 배포하지 않음)
        working-directory: game
        timeout-minutes: 15
        run: cargo test

      - name: 웹 빌드 (dist/)
        run: bash deploy/build.sh

      # 15MiB는 시작값이다. 첫 다운로드가 커지면 낮춘다.
      - name: 페이지와 크기 확인
        run: |
          test -f dist/index.html
          size=$(cat dist/*.wasm | gzip -c | wc -c)
          echo "wasm gzip: $size bytes"
          test "$size" -le 15728640

      - name: dist 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v5

  # 실패하거나 취소돼도 결과를 남긴다. always()는 이 작은 작업에만 쓴다.
  record:
    needs: [build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 배포 시도 결과 기록
        run: echo "build=${{ needs.build.result }} deploy=${{ needs.deploy.result }} commit=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
