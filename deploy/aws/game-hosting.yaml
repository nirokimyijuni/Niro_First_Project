AWSTemplateFormatVersion: "2010-09-09"
# 미쓰 찾기 게임 — AWS 정적 호스팅 (S3 + CloudFront + GitHub Actions OIDC 역할 + 예산 알림)
# 관리: 케빈(에이전트). 부모 결정 2026-11-20: 도메인 없이 cloudfront.net 주소, GitHub Pages와 두 곳 다 배포.
# 이 파일은 부모님이 AWS 콘솔(CloudFormation)에서 직접 올린다. 케빈은 AWS에 아무것도 만들지 않는다.
# 권장 리전: ap-northeast-2 (서울). 비밀 값(키·토큰)은 이 파일에 없다.
Description: Miss-game static hosting - private S3 + CloudFront (OAC, HTTPS) + GitHub OIDC deploy role (main only) + monthly budget alert

Parameters:
  GitHubOwner:
    Type: String
    Default: nirokimyijuni
    Description: GitHub 사용자(또는 조직) 이름
  GitHubRepo:
    Type: String
    Default: Niro_First_Project
    Description: 저장소 이름 (이 저장소의 main 브랜치만 배포 역할을 쓸 수 있다)
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: 계정에 GitHub OIDC 공급자(token.actions.githubusercontent.com)가 이미 있으면 false
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: CreateOidcProvider=false일 때만 기존 공급자 ARN을 넣는다
  CreateBudget:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: 월 예산 알림을 이 스택에서 만들지 (리전에서 안 되면 false로 하고 콘솔에서 직접 만든다)
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: 월 예산(미국 달러). 넘을 것 같으면 메일 알림 (자동으로 멈추지는 않는다)
  BudgetAlertEmail:
    Type: String
    Default: ""
    Description: 예산 알림 받을 부모님 메일 (콘솔에서만 입력, 파일에 적지 않는다)

# REVIEW-027 1번: 공급자를 안 만들 거면 기존 ARN이 꼭 있어야 한다. 스택 만들기 전에 막는다.
Rules:
  ExistingArnNeededWhenNotCreating:
    RuleCondition: !Equals [!Ref CreateOidcProvider, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingOidcProviderArn, ""]]
        AssertDescription: CreateOidcProvider가 false이면 ExistingOidcProviderArn을 넣어 주세요

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  MakeBudget: !And
    - !Equals [!Ref CreateBudget, "true"]
    - !Not [!Equals [!Ref BudgetAlertEmail, ""]]

Resources:
  # ---------- 저장소: 공개 접근 완전 차단. CloudFront(OAC)만 읽는다 ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    # 스택을 지워도 버킷이 남지 않게 Delete. 단, 버킷이 비어 있어야 지워진다 (README 참고).
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: miss-game
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # 200 = 한국·일본 포함, 가장 비싼 지역(남미 등) 제외
        PriceClass: PriceClass_200
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS 관리형 정책 "CachingOptimized" (기본 캐시). 배포 때마다 /* 무효화로 새 파일을 보이게 한다.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # 기본 인증서(*.cloudfront.net)로 https. 도메인은 나중에.
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnlyThisDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: DenyNonHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- GitHub Actions가 키 없이 들어오는 길 (OIDC) ----------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions (main branch only) uploads dist to the game bucket and invalidates CloudFront
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # main 브랜치 push만. (주의: 이 작업에 environment:를 붙이면 sub 모양이 바뀌어 막힌다)
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-game-site-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListThisBucketForSync
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: WriteThisBucketOnly
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Sid: InvalidateThisDistributionOnly
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  # ---------- 월 예산 알림 (알림만, 자동으로 멈추지 않는다) ----------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: MakeBudget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  BucketName:
    Description: GitHub 저장소 변수 AWS_S3_BUCKET 에 넣을 값
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub 저장소 변수 AWS_CLOUDFRONT_ID 에 넣을 값
    Value: !Ref SiteDistribution
  DistributionDomain:
    Description: GitHub 저장소 변수 AWS_CLOUDFRONT_DOMAIN 에 넣을 값 (플레이 주소 https://<이 값>/)
    Value: !GetAtt SiteDistribution.DomainName
  DeployRoleArn:
    Description: GitHub 저장소 변수 AWS_DEPLOY_ROLE_ARN 에 넣을 값 (이게 있어야 AWS 배포가 켜진다)
    Value: !GetAtt DeployRole.Arn
