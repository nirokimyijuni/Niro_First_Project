<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>미스 찾기</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #87cefa;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas:focus { outline: none; }
        /* 글꼴·그림을 받는 동안 보이는 "불러오는 중..." (시스템 글꼴).
           macroquad는 불러오는 동안에도 매 프레임 캔버스를 검게 지우므로 캔버스 "위"에 덮어 두고,
           게임이 첫 화면을 그리면 loading_done()으로 치운다. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #87cefa;
            color: #1f2a5c;
            font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            font-size: clamp(28px, 7vmin, 64px);
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">불러오는 중...</div>
    <script src="mq_js_bundle.js"></script>
    <script>
        // 게임(Rust)이 첫 화면을 그린 뒤 부른다 (game/src/view/web.rs).
        importObject.env.loading_done = function () {
            var el = document.getElementById("loading");
            if (el) el.remove();
        };
        // 타이틀 구석에 보이는 버전 (game/src/view/web.rs). window.GAME_VERSION은 deploy/build.sh가
        // dist/index.html에만 넣는다. 없으면 -1을 돌려줘서 게임이 버전을 안 그린다.
        importObject.env.game_version_byte = function (i) {
            var v = window.GAME_VERSION;
            if (typeof v !== "string") return -1;
            var bytes = new TextEncoder().encode(v);
            return i < bytes.length ? bytes[i] : -1;
        };
        load("miss-game.wasm");
    </script>
</body>
</html>
