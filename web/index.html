<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>미스 찾기</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #87cefa;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas:focus { outline: none; }
        /* 글꼴·그림을 받는 동안 보이는 "불러오는 중..." (시스템 글꼴).
           macroquad는 불러오는 동안에도 매 프레임 캔버스를 검게 지우므로 캔버스 "위"에 덮어 두고,
           게임이 첫 화면을 그리면 loading_done()으로 치운다. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #87cefa;
            color: #1f2a5c;
            font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            font-size: clamp(28px, 7vmin, 64px);
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">불러오는 중...</div>
    <script src="mq_js_bundle.js"></script>
    <script>
        // 게임(Rust)이 첫 화면을 그린 뒤 부른다 (game/src/view/web.rs).
        importObject.env.loading_done = function () {
            var el = document.getElementById("loading");
            if (el) el.remove();
        };
        // 타이틀 구석에 보이는 버전 (game/src/view/web.rs). window.GAME_VERSION은 deploy/build.sh가
        // dist/index.html에만 넣는다. 없으면 -1을 돌려줘서 게임이 버전을 안 그린다.
        importObject.env.game_version_byte = function (i) {
            var v = window.GAME_VERSION;
            if (typeof v !== "string") return -1;
            var bytes = new TextEncoder().encode(v);
            return i < bytes.length ? bytes[i] : -1;
        };
        // 최고 기록 (game/src/view/web.rs, US-044). 저장소를 못 쓰거나 값이 이상하면 0으로 시작한다.
        var BEST_DAYS_KEY = "miss-game.best-days";
        importObject.env.best_days_load = function () {
            try {
                var days = parseInt(localStorage.getItem(BEST_DAYS_KEY), 10);
                return days >= 0 && days <= 2147483647 ? days : 0;
            } catch (e) {
                return 0;
            }
        };
        importObject.env.best_days_save = function (days) {
            try {
                localStorage.setItem(BEST_DAYS_KEY, String(days));
            } catch (e) {}
        };
        // macroquad는 window resize 때만 캔버스 버퍼를 맞춘다. 주소창·전체화면·회전으로 CSS 크기만 바뀌어도
        // 버퍼와 어긋나지 않게, 캔버스 크기가 바뀔 때마다 맞춘다 (어긋나면 그림과 터치 자리가 위아래로 벌어진다).
        var canvasEl = document.getElementById("glcanvas");
        function fitCanvas() {
            if (wasm_exports) resize(canvasEl, wasm_exports.resize);
        }
        if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvasEl);
        // 전체화면이 아니면 손가락을 뗄 때마다 전체화면 + 가로 고정 (안드로이드 Chrome). touchend는 브라우저가 허락하는 "사용자 동작"이다.
        // 지원하지 않거나 거절되면 조용히 넘어가고, 게임의 세로 안내가 그대로 일한다 (아이폰 Safari 등).
        function goFullscreen() {
            var root = document.documentElement;
            if (document.fullscreenElement || !root.requestFullscreen) return;
            try {
                root.requestFullscreen({ navigationUI: "hide" }).then(function () {
                    if (screen.orientation && screen.orientation.lock) {
                        return screen.orientation.lock("landscape");
                    }
                }).catch(function () {});
            } catch (e) {}
        }
        canvasEl.addEventListener("touchend", goFullscreen);
        // 폰 확인용: 주소 끝에 ?debug 를 붙이면 화면 맨 위에 크기와 마지막 터치 자리를 보여 준다.
        if (location.search.indexOf("debug") >= 0) {
            var debugBox = document.createElement("div");
            debugBox.style.cssText = "position:fixed;top:0;left:0;z-index:20;pointer-events:none;background:#000;color:#fff;font:12px monospace";
            document.body.appendChild(debugBox);
            canvasEl.addEventListener("touchstart", function (e) {
                var r = canvasEl.getBoundingClientRect(), t = e.changedTouches[0], v = window.visualViewport;
                debugBox.textContent = "inner " + innerWidth + "x" + innerHeight
                    + " vv " + (v ? v.width + "x" + v.height + "+" + v.offsetTop + " s" + v.scale : "-")
                    + " rect " + r.left + "," + r.top + " " + r.width + "x" + r.height
                    + " buf " + canvasEl.width + "x" + canvasEl.height
                    + " dpr " + devicePixelRatio + " touch " + t.clientX + "," + t.clientY;
            });
        }
        load("miss-game.wasm");
    </script>
</body>
</html>
