<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <!-- 아이콘 (헤일리 그림, 부모님 승인 2026-11-21). 주소는 상대 경로. -->

    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <!-- 홈 화면 앱으로 열면 주소줄 없이 꽉 차게 (아이폰은 manifest의 display를 늦게 읽어서 옛 방식 meta도 둔다) -->

    <link rel="canonical" href="__SITE_URL__">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="미스 찾기">
    <meta property="og:url" content="__SITE_URL__">
    <meta property="og:title" content="미스 찾기 - 가족이 함께 만든 생존 게임">
    <meta property="og:description" content="낮에는 캐고 모으고, 밤에는 몬스터를 물리치며 7일을 버텨요. 숨은 미스를 찾아보세요!">
    <meta property="og:image" content="__SITE_URL__og-image.png">
    <meta property="og:image:width" content="1200">

    <meta name="twitter:description" content="낮에는 캐고 모으고, 밤에는 몬스터를 물리치며 7일을 버텨요. 숨은 미스를 찾아보세요!">
    <meta name="twitter:image" content="__SITE_URL__og-image.png">
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #87cefa;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas:focus { outline: none; }
        /* 글꼴·그림을 받는 동안 보이는 도는 점 + "Now Loading..." (시스템 글꼴).
           로고 첫 화면과 같은 빨강(#FF0000, game/src/view/logo.rs LOGO_RED)이라 로고로 넘어갈 때 깜빡이지 않는다.
           게임 안의 같은 화면(logo.rs draw_loading)과 모양·빠르기(점 8개, 1초에 한 바퀴)를 맞췄다.
           macroquad는 불러오는 동안에도 매 프레임 캔버스를 검게 지우므로 캔버스 "위"에 덮어 두고,
           게임이 첫 화면을 그리면 loading_done()으로 치운다. */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5vmin;
            background: #ff0000;
            color: #ffffff;
            font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            font-size: clamp(24px, 7vmin, 64px);
            font-weight: bold;
            text-shadow: 0.06em 0.06em 0 rgba(115, 0, 0, 0.45);
            pointer-events: none;
        }
        #loading .spinner {
            position: relative;
            width: clamp(50px, 14vmin, 126px);
            height: clamp(50px, 14vmin, 126px);
            animation: loading-spin 1s steps(8) infinite;
        }
        #loading .spinner i {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 18%;
            height: 18%;
            margin: -9% 0 0 -9%;
            border-radius: 50%;
            background: #ffffff;
            transform: rotate(calc(var(--k) * 45deg)) translateY(-260%);
        }
        @keyframes loading-spin {
            to { transform: rotate(360deg); }
        }
        /* 카카오톡 안 브라우저 안내: 아래 가운데 작은 카드. 게임·Now Loading·눌러서 시작은 가리지 않는 자리와 크기. */
        #kakao-tip {
            position: fixed;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: fit-content;
            bottom: max(8px, env(safe-area-inset-bottom));
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 92vw;
            box-sizing: border-box;
            word-break: keep-all;
            line-height: 1.25;
            padding: 6px 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            color: #333333;
            font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            font-size: clamp(12px, 3.2vmin, 17px);
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            touch-action: manipulation;
        }
        #kakao-tip[hidden] { display: none; }
        #kakao-tip button[hidden] { display: none; }
        #kakao-tip button {
            font: inherit;
            border: 0;
            border-radius: 10px;
            padding: 8px 12px;
            min-height: 36px;
            white-space: nowrap;
            cursor: pointer;
        }
        #kakao-tip .go { background: #ffcc00; color: #222222; }
        #kakao-tip .skip { background: #e6e6e6; color: #444444; }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">
        <div class="spinner" aria-hidden="true">
            <i style="--k:0;opacity:.125"></i><i style="--k:1;opacity:.25"></i>
            <i style="--k:2;opacity:.375"></i><i style="--k:3;opacity:.5"></i>
            <i style="--k:4;opacity:.625"></i><i style="--k:5;opacity:.75"></i>
            <i style="--k:6;opacity:.875"></i><i style="--k:7;opacity:1"></i>
        </div>
        <div>Now Loading...</div>
    </div>
    <div id="kakao-tip" hidden>
        <span class="msg"></span>
        <button type="button" class="go">다른 브라우저로 열기</button>
        <button type="button" class="skip">그냥 할래요</button>
    </div>
    <script>
        // 소리 풀기 (US-112). 브라우저는 첫 누름 전에는 소리를 막는다. macroquad 번들은 소리 맥락(AudioContext)을 풀 때
        // 손가락을 "댄 순간"(touchstart)에도 한 번 쓰고 그 뒤 듣는 것을 모두 치우는데, 아이폰 Safari는 "뗀 순간"(touchend)만 인정한다.
        // 그래서 번들보다 먼저 AudioContext를 만들 때마다 기억해 두고, 누르고 뗄 때마다 멈춰 있는 것을 다시 푼다.
        // 탭이 가려지거나 앱을 나가면 소리를 멈추고, 돌아오면 다시 낸다 (임시-115). 게임(Rust)은 이 일을 모른다.
        (function () {
            var Native = window.AudioContext || window.webkitAudioContext;
            if (!Native) return;
            var contexts = [];
            function Wrapped(options) {
                var ctx = options === undefined ? new Native() : new Native(options);
                contexts.push(ctx);
                return ctx;
            }
            Wrapped.prototype = Native.prototype;
            window.AudioContext = Wrapped;
            window.webkitAudioContext = Wrapped;
            window.__soundContexts = contexts; // 확인용
            var hidden = false;
            function resumeAll() {
                if (hidden) return;
                contexts.forEach(function (c) {
                    try { if (c.state !== "running") c.resume().catch(function () {}); } catch (e) {}
                });
            }
            ["touchend", "pointerup", "mouseup", "click", "keydown"].forEach(function (name) {
                window.addEventListener(name, resumeAll, true);
            });
            function setHidden(h) {
                hidden = h;
                contexts.forEach(function (c) {
                    try {
                        if (hidden) { if (c.state === "running") c.suspend().catch(function () {}); }
                        else if (c.state !== "running") c.resume().catch(function () {});
                    } catch (e) {}
                });
            }
            document.addEventListener("visibilitychange", function () { setHidden(document.visibilityState === "hidden"); });
            window.addEventListener("pagehide", function () { setHidden(true); });
            window.addEventListener("pageshow", function () { setHidden(document.visibilityState === "hidden"); });
        })();
    </script>
    <script src="mq_js_bundle.js"></script>
    <script>
        // 게임(Rust)이 첫 화면을 그린 뒤 부른다 (game/src/view/web.rs).
        importObject.env.loading_done = function () {
            var el = document.getElementById("loading");
            if (el) el.remove();
        };
        // 타이틀 구석에 보이는 버전 (game/src/view/web.rs). window.GAME_VERSION은 deploy/build.sh가
        // dist/index.html에만 넣는다. 없으면 -1을 돌려줘서 게임이 버전을 안 그린다.
        importObject.env.game_version_byte = function (i) {
            var v = window.GAME_VERSION;
            if (typeof v !== "string") return -1;
            var bytes = new TextEncoder().encode(v);
            return i < bytes.length ? bytes[i] : -1;
        };
        // 최고 기록 (game/src/view/web.rs, US-044). 저장소를 못 쓰거나 값이 이상하면 0으로 시작한다.
        var BEST_DAYS_KEY = "miss-game.best-days";
        importObject.env.best_days_load = function () {
            try {
                var days = parseInt(localStorage.getItem(BEST_DAYS_KEY), 10);
                return days >= 0 && days <= 2147483647 ? days : 0;
            } catch (e) {
                return 0;
            }
        };
        importObject.env.best_days_save = function (days) {
            try {
                localStorage.setItem(BEST_DAYS_KEY, String(days));
            } catch (e) {}
        };
        // 설정 저장 (game/src/view/web.rs, US-125). 새 키 하나. 못 쓰거나 값이 이상하면 조용히 넘어간다.
        // 한계: 이 브라우저 안에만 저장된다 (다른 기기·시크릿 창·브라우저 데이터 지움이면 사라진다).
        var SETTINGS_KEY = "miss-game.settings";
        var SETTINGS_MAX_CHARS = 200; // config.rs의 SETTINGS_MAX_CHARS와 같게
        var settingsLoaded = null; // 읽은 글자의 바이트 (0번째를 부를 때 새로 읽는다)
        var settingsSaving = [];
        importObject.env.settings_load_byte = function (i) {
            try {
                if (i === 0 || settingsLoaded === null) {
                    var t = localStorage.getItem(SETTINGS_KEY);
                    settingsLoaded = typeof t === "string" && t.length <= SETTINGS_MAX_CHARS
                        ? new TextEncoder().encode(t) : new Uint8Array(0);
                }
                return i < settingsLoaded.length ? settingsLoaded[i] : -1;
            } catch (e) {
                return -1;
            }
        };
        importObject.env.settings_save_begin = function () { settingsSaving = []; };
        importObject.env.settings_save_byte = function (b) {
            if (settingsSaving.length < SETTINGS_MAX_CHARS * 4) settingsSaving.push(b & 255);
        };
        importObject.env.settings_save_end = function () {
            try {
                localStorage.setItem(SETTINGS_KEY, new TextDecoder().decode(new Uint8Array(settingsSaving)));
            } catch (e) {}
        };
        importObject.env.settings_clear = function () {
            try {
                localStorage.removeItem(SETTINGS_KEY);
            } catch (e) {}
        };
        // 최고 점수 (US-069). 버틴 날 최고 기록과 따로 저장한다.
        var BEST_SCORE_KEY = "miss-game.best-score";
        importObject.env.best_score_load = function () {
            try {
                var score = parseInt(localStorage.getItem(BEST_SCORE_KEY), 10);
                return score >= 0 && score <= 2147483647 ? score : 0;
            } catch (e) {
                return 0;
            }
        };
        importObject.env.best_score_save = function (score) {
            try {
                localStorage.setItem(BEST_SCORE_KEY, String(score));
            } catch (e) {}
        };
        // 시험용 단축 (game/src/view/qa.rs): 주소에 ?qa가 있을 때만 1. 보통 주소에서는 0이라 아무 일 없다.
        importObject.env.qa_mode_on = function () {
            try {
                return new URLSearchParams(window.location.search).has("qa") ? 1 : 0;
            } catch (e) {
                return 0;
            }
        };
        // 시험용인데 튜토리얼 말풍선은 보고 싶을 때 (US-123): 주소가 ?qa=tutorial일 때만 1. ?qa만으로는 0.
        importObject.env.qa_tutorial_on = function () {
            try {
                return new URLSearchParams(window.location.search).get("qa") === "tutorial" ? 1 : 0;
            } catch (e) {
                return 0;
            }
        };
        // macroquad는 window resize 때만 캔버스 버퍼를 맞춘다. 주소창·전체화면·회전으로 CSS 크기만 바뀌어도
        // 버퍼와 어긋나지 않게, 캔버스 크기가 바뀔 때마다 맞춘다 (어긋나면 그림과 터치 자리가 위아래로 벌어진다).
        var canvasEl = document.getElementById("glcanvas");
        function fitCanvas() {
            if (wasm_exports) resize(canvasEl, wasm_exports.resize);
        }
        if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvasEl);
        // 아이폰 홈 화면 앱(standalone): position:fixed + height:100%가 아래 안전 영역(홈 표시줄 자리)을 뺀 높이라
        // 맨 아래에 html 배경(하늘색) 띠가 보인다. 그때만 캔버스·로딩 덮개를 화면 전체 높이까지 늘린다.
        // 보통 브라우저 창에서는 빈 문자열(= 예전 CSS 그대로)을 돌려줘서 아무 일 없다. 늘리는 양은 80px까지만 (이상한 값 방어).
        // 세로면 긴 변, 가로면 짧은 변이 화면 높이다 (아이폰은 screen.width/height가 돌아도 안 바뀐다).
        function standaloneFillHeight(standalone, screenW, screenH, innerW, innerH) {
            if (!standalone || !(screenW > 0) || !(screenH > 0) || !(innerW > 0) || !(innerH > 0)) return "";
            var full = innerH > innerW ? Math.max(screenW, screenH) : Math.min(screenW, screenH);
            var extra = full - innerH;
            return extra > 0 && extra <= 80 ? full + "px" : "";
        }
        window.standaloneFillHeight = standaloneFillHeight;
        function fillSafeArea() {
            var standalone = false;
            try {
                standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
            } catch (e) {}
            var h = standaloneFillHeight(standalone, screen.width, screen.height, window.innerWidth, window.innerHeight);
            canvasEl.style.height = h;
            var loadingEl = document.getElementById("loading");
            if (loadingEl) loadingEl.style.height = h;
        }
        fillSafeArea();
        window.addEventListener("resize", fillSafeArea);
        window.addEventListener("orientationchange", function () { setTimeout(fillSafeArea, 300); });
        // 전체화면이 아니면 손가락을 뗄 때마다 전체화면 + 가로 고정 (안드로이드 Chrome). touchend는 브라우저가 허락하는 "사용자 동작"이다.
        // 지원하지 않거나 거절되면 조용히 넘어가고, 게임의 세로 안내가 그대로 일한다 (아이폰 Safari 등).
        function goFullscreen() {
            var root = document.documentElement;
            if (document.fullscreenElement || !root.requestFullscreen) return;
            try {
                root.requestFullscreen({ navigationUI: "hide" }).then(function () {
                    if (screen.orientation && screen.orientation.lock) {
                        return screen.orientation.lock("landscape");
                    }
                }).catch(function () {});
            } catch (e) {}
        }
        canvasEl.addEventListener("touchend", goFullscreen);
        // 폰에서는 기본으로 가로 (부모님 결정 2026-11-21): "눌러서 시작"을 누르는 첫 입력이 터치가 아니어도
        // (펜, 블루투스 키보드 등) 전체화면 + 가로로 바꾼다. 게임 안 코드는 "사용자 동작"이 아니라서 여기 웹페이지 이벤트에서 부른다.
        // 터치 기기(주 입력이 손가락)에서만: PC는 키·클릭으로 누르면 전체화면이 되지 않는다 (PC 전체화면은 원래 방식 그대로).
        // 이 이벤트는 게임 입력을 막거나 바꾸지 않는다: 누른 것이 로고 넘기기·게임 시작으로 새지 않는 것은 게임(view/logo.rs)이 지킨다.
        var touchDevice = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
        if (touchDevice) {
            window.addEventListener("keydown", function (e) {
                // Esc, 누르고 있어서 반복되는 키, Ctrl/Alt/Meta 조합은 건너뛴다 (Esc로 나간 뒤 Shift·F12로 다시 전체화면이 되지 않게)
                if (e.key === "Escape" || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
                goFullscreen();
            });
            // 손가락은 위의 touchend가 이미 부르므로 펜만 (두 번 부르지 않게)
            window.addEventListener("pointerup", function (e) {
                if (e.pointerType === "pen") goFullscreen();
            });
        }
        // 폰 확인용: 주소 끝에 ?debug 를 붙이면 화면 맨 위에 크기와 마지막 터치 자리를 보여 준다.
        if (location.search.indexOf("debug") >= 0) {
            var debugBox = document.createElement("div");
            debugBox.style.cssText = "position:fixed;top:0;left:0;z-index:20;pointer-events:none;background:#000;color:#fff;font:12px monospace";
            document.body.appendChild(debugBox);
            canvasEl.addEventListener("touchstart", function (e) {
                var r = canvasEl.getBoundingClientRect(), t = e.changedTouches[0], v = window.visualViewport;
                debugBox.textContent = "inner " + innerWidth + "x" + innerHeight
                    + " vv " + (v ? v.width + "x" + v.height + "+" + v.offsetTop + " s" + v.scale : "-")
                    + " rect " + r.left + "," + r.top + " " + r.width + "x" + r.height
                    + " buf " + canvasEl.width + "x" + canvasEl.height
                    + " dpr " + devicePixelRatio + " touch " + t.clientX + "," + t.clientY;
            });
        }
        // 큰 화면 안내 카드 (부모님 요청 2026-11-21). 카톡·앱 안 브라우저·아이폰 브라우저는 웹페이지가 전체화면·가로 돌리기를 못 한다.
        // 어떤 안내를 띄울지 판별은 여기 한 곳(tipKindFor)만:
        //   "kakao"      카카오톡 안 브라우저 (아이폰·안드로이드 둘 다): 다른 브라우저로 열기 버튼
        //   "inapp"      인스타그램·페이스북·라인·네이버 등 앱 안 브라우저: 가로로 못 돌림. 글만 (외부로 보내는 주소 규칙이 없다)
        //   "ios-safari" 아이폰·아이패드 Safari: 홈 화면에 추가 방법
        //   "ios-other"  아이폰의 Chrome(CriOS) 등 다른 브라우저: Safari에서 열어 홈 화면에 추가
        //   null         안드로이드·PC, 이미 홈 화면 앱으로 연 상태, ?qa: 안내 없음
        // env: { qa, platform, touchPoints, standalone } (시험에서 UA 흉내를 낼 수 있게 밖에서 받는다)
        function tipKindFor(ua, env) {
            if (env.qa) return null;
            if (/kakaotalk/i.test(ua)) return "kakao";
            if (/Instagram|FBAN|FBAV|FB_IAB|FBIOS|\bLine\/|NAVER\(inapp|DaumApps/i.test(ua)) return "inapp";
            var ios = /iPhone|iPad|iPod/.test(ua) || (env.platform === "MacIntel" && env.touchPoints > 1);
            if (!ios || env.standalone) return null;
            return /CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|DuckDuckGo|GSA\/|YaBrowser|Brave/.test(ua) ? "ios-other" : "ios-safari";
        }
        function tipKind() {
            var standalone = navigator.standalone === true;
            try {
                standalone = standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches);
            } catch (e) {}
            return tipKindFor(navigator.userAgent || "", {
                qa: location.search.indexOf("qa") >= 0,
                platform: navigator.platform,
                touchPoints: navigator.maxTouchPoints,
                standalone: standalone
            });
        }
        // 카드가 플레이 중 아래 안내·무기를 가리지 않게, 이만큼 지나면 알아서 사라진다 (닫기를 눌러 저장한 것과 달리 다음에 열면 또 보인다)
        var TIP_AUTO_HIDE_MS = 15000;
        (function () {
            var kind = tipKind();
            var tip = document.getElementById("kakao-tip");
            if (!tip || !kind) return;
            // 카톡·앱 안 브라우저 안내는 같은 탭에서만 기억, 홈 화면 안내는 닫으면 다시 안 뜬다
            var store = kind === "kakao" || kind === "inapp" ? "sessionStorage" : "localStorage";
            var key = "miss-game.tip-closed." + kind;
            try {
                if (window[store].getItem(key) === "1") return;
            } catch (e) {}
            var message = {
                "kakao": "더 크게 보려면 Safari나 Chrome으로 열어요",
                "inapp": "이 앱 안에서는 가로로 못 돌려요. 메뉴(⋯)에서 Safari나 브라우저로 열어요",
                "ios-safari": "홈 화면에 추가하면 꽉 차게 열려요. 공유 버튼 → 홈 화면에 추가",
                "ios-other": "꽉 차게 하려면 Safari에서 열어 홈 화면에 추가해요. 공유 버튼 → 홈 화면에 추가"
            }[kind];
            tip.querySelector(".msg").textContent = message;
            var go = tip.querySelector(".go");
            // 안내를 누른 손가락이 게임으로 새지 않게: 카드는 캔버스와 형제 요소라 이벤트가 캔버스로 가지 않고, 윈도우로 올라가는 것도 막는다.
            ["pointerdown", "pointerup", "touchstart", "touchend", "mousedown", "mouseup", "click", "keydown"].forEach(function (name) {
                tip.addEventListener(name, function (e) { e.stopPropagation(); });
            });
            if (kind === "kakao") {
                // 자동으로 넘기지 않는다: 버튼을 눌러야만 카톡에 "외부 브라우저로 열기"를 부탁한다.
                go.addEventListener("click", function () {
                    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
                });
            } else {
                go.hidden = true;
            }
            tip.querySelector(".skip").textContent = kind === "kakao" ? "그냥 할래요" : "닫기";
            tip.querySelector(".skip").addEventListener("click", function () {
                tip.hidden = true;
                try { window[store].setItem(key, "1"); } catch (e) {}
            });
            tip.hidden = false;
            setTimeout(function () { tip.hidden = true; }, TIP_AUTO_HIDE_MS);
        })();
        load("miss-game.wasm");
    </script>
</body>
</html>
